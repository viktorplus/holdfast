[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdfast"
version = "0.2.1"
description = "Back up a Linux server and watch it for tampering"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
holdfast = "holdfast.cli:run"

[tool.setuptools.packages.find]
include = ["holdfast*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_privacy_guard.py imports tools.privacy_guard, which lives in the
# repository and not in the installed package. Without this, only
# `python -m pytest` can collect the suite; bare `pytest` cannot.
pythonpath = ["."]
